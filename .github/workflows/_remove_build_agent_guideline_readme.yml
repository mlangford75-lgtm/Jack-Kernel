name: One-shot README build-agent guideline cleanup

on:
  push:
    branches:
      - docs/remove-build-agent-guideline-readme

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/remove-build-agent-guideline-readme
          fetch-depth: 0

      - name: Remove build-agent guideline from README only
        shell: pwsh
        run: |
          $path = 'README.md'
          $target = '**Be strict about truth, identity, authority, and irreversible consequences; be resilient about useful work.**'
          $text = [System.IO.File]::ReadAllText($path)
          $count = ([regex]::Matches($text, [regex]::Escape($target))).Count
          if ($count -ne 1) {
            Write-Error "Expected exactly one README match, found $count."
            exit 1
          }
          $text = $text.Replace("$target`r`n`r`n", '')
          $text = $text.Replace("$target`n`n", '')
          if ($text.Contains($target)) {
            Write-Error 'Target guideline still remains in README.'
            exit 1
          }
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          git diff --check
          git diff -- README.md
          $unexpected = git status --porcelain | Where-Object { $_ -notmatch '^ M README.md$' }
          if ($unexpected) {
            $unexpected | Write-Host
            Write-Error 'Unexpected files changed.'
            exit 1
          }

      - name: Commit README cleanup
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Remove build-agent guidance from README'
          git push origin HEAD:docs/remove-build-agent-guideline-readme
