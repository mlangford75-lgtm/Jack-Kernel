name: Agentic recovery focused gates

on:
  push:
    branches:
      - recovery/agentic-identity-memory-alignment-20261112
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-contracts:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.6"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.16.0"
      - name: Install validated Python test environment
        shell: pwsh
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements-test.txt
      - name: Compile and validate Agentic recovery and preserved tool/monitor contracts
        shell: pwsh
        run: |
          python -m py_compile jack_kernel.py jack_context_monitor.py
          python -m pytest -q tests/test_agentic_reasoning_primary_memory_experiment.py tests/test_agentic_trailing_tool_result_frontier.py tests/test_context_monitor.py tests/test_agentic_portable_anchor_stream_contract.py tests/test_agentic_task_anchor_release_contract.py tests/test_agentic_transaction_linked_memory.py tests/test_agentic_phase3g_recovery_contract.py
      - name: Run Pi control and tool bridge regression harnesses
        shell: pwsh
        run: |
          node tests/pi_control_bridge_v2_harness.mjs
          node tests/pi_control_bridge_cancel_ownership_harness.mjs
          node tests/pi_control_bridge_deferred_dispatch_harness.mjs
          node tests/pi_control_bridge_retry_recovery_harness.mjs
          node tests/pi_control_bridge_multi_endpoint_harness.mjs
          node tests/pi_provider_runtime_binding_harness.mjs
          node tests/pi_phase4_executor_admission_harness.mjs
          node tests/pi_edit_origin_policy_harness.mjs
