name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-validated-baseline:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.14.6
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.6"

      - name: Set up Node 24.16.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.16.0"

      - name: Install validated Python test environment
        shell: pwsh
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements-test.txt

      - name: Report validated toolchain
        shell: pwsh
        run: |
          python --version
          python -m pip --version
          node --version
          python -c "import sys,fastapi,uvicorn,httpx,pytest,starlette,pydantic; expected={'python':'3.14.6','fastapi':'0.137.1','uvicorn':'0.49.0','httpx':'0.28.1','pytest':'9.1.1','starlette':'1.3.1','pydantic':'2.13.4'}; actual={'python':sys.version.split()[0],'fastapi':fastapi.__version__,'uvicorn':uvicorn.__version__,'httpx':httpx.__version__,'pytest':pytest.__version__,'starlette':starlette.__version__,'pydantic':pydantic.__version__}; print(actual); assert actual == expected, (actual, expected)"

      - name: Compile runtime modules
        shell: pwsh
        run: |
          python -m py_compile jack_kernel.py jack_secure_entrypoint.py jack_evidence_guard.py jack_responses_compat.py

      - name: Run Python regression suite
        shell: pwsh
        run: python -m pytest -q

      - name: Run Pi control bridge harnesses
        shell: pwsh
        run: |
          node tests/pi_control_bridge_v2_harness.mjs
          node tests/pi_control_bridge_cancel_ownership_harness.mjs
          node tests/pi_control_bridge_deferred_dispatch_harness.mjs
          node tests/pi_control_bridge_retry_recovery_harness.mjs
