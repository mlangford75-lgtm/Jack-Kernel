name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  apply-phase5-architecture-corrections:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true && github.event.pull_request.head.ref == 'security-phase5-consequence-gate' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact draft branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security-phase5-consequence-gate
          fetch-depth: 0

      - name: Apply narrow Phase-5 authority corrections when staged
        shell: bash
        run: |
          if [ ! -f .github/phase5_apply_corrections.py ]; then
            echo "No staged correction applicator remains; nothing to apply."
            exit 0
          fi
          python .github/phase5_apply_corrections.py
          # Workflow files are restored to the checked-out version here because
          # the Actions token is intentionally not workflow-authoritative. The
          # authenticated repository connector restores final read-only CI later.
          git checkout -- .github/workflows/ci.yml
          python -c "from pathlib import Path; p=Path('jack_path_policy.py'); p.write_text(p.read_text(encoding='utf-8').rstrip('\\n')+'\\n', encoding='utf-8', newline='\\n')"
          git diff --check
          test ! -e .github/phase5_apply_corrections.py
          test ! -e jack_path_authority_facts.py
          git status --short

      - name: Commit corrected draft branch when changes exist
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No correction changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 5: correct security authority ownership"
          git push origin HEAD:security-phase5-consequence-gate

  windows-validated-baseline:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.14.6
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.6"

      - name: Set up Node 24.16.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.16.0"

      - name: Install validated Python test environment
        shell: pwsh
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements-test.txt

      - name: Report validated toolchain
        shell: pwsh
        run: |
          python --version
          python -m pip --version
          node --version
          python -c "import sys,fastapi,uvicorn,httpx,pytest,starlette,pydantic; expected={'python':'3.14.6','fastapi':'0.137.1','uvicorn':'0.49.0','httpx':'0.28.1','pytest':'9.1.1','starlette':'1.3.1','pydantic':'2.13.4'}; actual={'python':sys.version.split()[0],'fastapi':fastapi.__version__,'uvicorn':uvicorn.__version__,'httpx':httpx.__version__,'pytest':pytest.__version__,'starlette':starlette.__version__,'pydantic':pydantic.__version__}; print(actual); assert actual == expected, (actual, expected)"

      - name: Compile runtime modules
        shell: pwsh
        run: |
          python -m py_compile jack_kernel.py jack_secure_entrypoint.py jack_evidence_guard.py jack_path_policy.py jack_path_authority_facts.py jack_responses_compat.py jack_consequence_gate.py

      - name: Report Pi bridge identities
        shell: pwsh
        run: |
          python -c "from pathlib import Path; import hashlib; b=Path('Pi/pi-control-bridge.ts').read_bytes(); lf=b.replace(b'\r\n',b'\n'); crlf=lf.replace(b'\n',b'\r\n'); print('PI_BRIDGE_LF_SHA256='+hashlib.sha256(lf).hexdigest()); print('PI_BRIDGE_CRLF_SHA256='+hashlib.sha256(crlf).hexdigest())"

      - name: Run Phase-5 targeted tests
        shell: pwsh
        run: python -m pytest -q tests/test_phase5_consequence_gate.py tests/test_phase5_path_gate_integration.py tests/test_phase5_runtime_integration.py tests/test_phase5_secure_entrypoint.py

      - name: Run Python regression suite
        shell: pwsh
        run: python -m pytest -q

      - name: Run Pi control bridge harnesses
        shell: pwsh
        run: |
          node tests/pi_control_bridge_v2_harness.mjs
          node tests/pi_control_bridge_cancel_ownership_harness.mjs
          node tests/pi_control_bridge_deferred_dispatch_harness.mjs
          node tests/pi_control_bridge_retry_recovery_harness.mjs
          node tests/pi_control_bridge_multi_endpoint_harness.mjs
          node tests/pi_provider_runtime_binding_harness.mjs
          node tests/pi_phase4_executor_admission_harness.mjs
