name: Combined runtime code, policy integrity and diagnostic privacy qualification

on:
  push:
    branches:
      - security/phase10-authority-policy-integrity-20261125
  pull_request:
    paths:
      - 'jack_policy_integrity.py'
      - 'jack_kernel.py'
      - 'jack_credential_guard.py'
      - 'jack_credential_resource_guard.py'
      - 'tests/test_security_center.py'
      - 'jack_loop_detector.py'
      - 'jack_tool_recovery.py'
      - 'tests/test_security_denial_recovery.py'
      - 'jack_evidence_guard.py'
      - 'tests/test_streaming_irq_sensitivity.py'
      - 'jack_runtime_code_guard.py'
      - 'jack_phase9b_enforcement.py'
      - 'tests/test_runtime_code_*.py'
      - 'tests/test_agentic_interrupted_tool_recovery.py'
      - 'jack_phase10_dynamic_authority.py'
      - 'jack_phase11_privacy.py'
      - 'tests/test_dynamic_authority_and_diagnostic_privacy.py'
      - 'jack_phase10_path_enforcement.py'
      - 'jack_phase10_canary_enforcement.py'
      - 'jack_phase10_credential_enforcement.py'
      - 'jack_secure_entrypoint.py'
      - 'tests/test_consequence_gate_secure_entrypoint.py'
      - 'tests/test_runtime_code_live_security_http_tamper.py'
      - 'tests/test_policy_integrity_policy_identity.py'
      - 'tests/test_policy_integrity_real_policy_consumers.py'
      - 'docs/security/PHASE10_A_ACTIVE_POLICY_AUTHORITY_MAP_2026-11-25.md'
      - '.github/workflows/security-policy-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-policy-windows-qualification:
    runs-on: windows-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python 3.14.6
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.6'
      - name: Install pinned test environment
        shell: pwsh
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements-test.txt
      - name: Compile Policy Integrity static enforcement candidate
        run: python -m py_compile jack_secure_entrypoint.py jack_phase10_path_enforcement.py jack_phase10_canary_enforcement.py jack_phase10_credential_enforcement.py jack_policy_integrity.py tests/test_policy_integrity_policy_identity.py tests/test_policy_integrity_real_policy_consumers.py
      - name: Run Policy Integrity static-policy identity and tamper controls
        run: python -m pytest -q tests/test_policy_integrity_policy_identity.py
      - name: Run real Jack Kernel path Canary and credential consumer identity proof
        run: python -m pytest -q tests/test_policy_integrity_real_policy_consumers.py
      - name: Compile dynamic authority and diagnostic privacy candidate
        run: python -m py_compile jack_phase10_dynamic_authority.py jack_phase11_privacy.py tests/test_dynamic_authority_and_diagnostic_privacy.py
      - name: Qualify dynamic pending authority and diagnostic privacy
        run: python -m pytest -q tests/test_dynamic_authority_and_diagnostic_privacy.py
      - name: Run previous Credential Isolation credential and Source Drift Protection policy/security controls
        run: python -m pytest -q tests/test_credential_policy.py tests/test_source_drift_source_baseline.py tests/test_source_drift_runtime_enforcement.py
      - name: Preserve Credential Isolation diagnostic and orchestration release controls
        run: python -m pytest -q tests/test_credential_diagnostic_dlp.py tests/test_credential_diagnostic_headers.py tests/test_credential_diagnostic_outer_release.py tests/test_credential_orchestration_dlp.py tests/test_credential_output_dlp.py
      - name: Verify loaded executable and source security
        run: python -m pytest -q tests/test_runtime_code_guard.py tests/test_runtime_code_enforced_release.py tests/test_runtime_code_source_closure.py
      - name: Verify pending recovery and exact frozen answer retry
        run: python -m pytest -q tests/test_agentic_interrupted_tool_recovery.py
      - name: Verify local Security Center configuration and launcher transport
        run: python -m pytest -q tests/test_security_center.py tests/test_streaming_irq_sensitivity.py tests/test_streaming_irq_canaries.py tests/test_nonstream_irq_canaries.py tests/test_streaming_irq_quarantine.py tests/test_streaming_irq_integration.py tests/test_secondary_prompt_launcher_retirement.py tests/test_credential_ledger_resources.py
      - name: Verify loop continuity and immutable security denial recovery
        run: python -m pytest -q tests/test_loop_detector.py tests/test_loop_kernel_integration.py tests/test_security_denial_recovery.py tests/test_tool_recovery_handoff25.py tests/test_restricted_path_multicall_containment.py
      - name: Measure StreamingIRQ matching overhead with synthetic keys
        run: python tests/benchmark_streaming_irq.py
      - name: Verify combined mandatory startup and live HTTP security
        run: python -m pytest -q tests/test_consequence_gate_secure_entrypoint.py tests/test_runtime_code_secure_child_http.py tests/test_runtime_code_live_security_http_tamper.py
