name: Current-main full regression diagnostics (no bypasses)

on:
  push:
    branches:
      - ci/full-regression-diagnostics-20261125
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-python-regression:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact current-main diagnostic snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python 3.14.6
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.6'
      - name: Set up Node 24.16.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.16.0
      - name: Install pinned test dependencies
        shell: pwsh
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements-test.txt
      - name: Execute every Python regression test without exclusions or xfails
        shell: pwsh
        run: python -m pytest -q -ra

  pi-bridge-harnesses:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact current-main diagnostic snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node 24.16.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.16.0
      - name: Pi bridge, ownership and executor admission harnesses
        shell: pwsh
        run: |
          node tests/pi_control_bridge_v2_harness.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/pi_control_bridge_cancel_ownership_harness.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/pi_control_bridge_deferred_dispatch_harness.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/pi_control_bridge_retry_recovery_harness.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/pi_control_bridge_multi_endpoint_harness.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/pi_provider_runtime_binding_harness.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/pi_phase4_executor_admission_harness.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/pi_edit_origin_policy_harness.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
