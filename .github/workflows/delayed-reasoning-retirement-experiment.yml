name: Delayed reasoning retirement experimental regressions
on:
  push:
    branches:
      - experiment/agentic-phase3g-delayed-r2-retirement-20261022
  workflow_dispatch:
jobs:
  delayed-reasoning-retirement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run Agentic baseline and delayed reasoning retirement regression suites
        run: |
          python -m pytest -q             tests/test_agentic_turn_artifact_retention.py             tests/test_agentic_turn_lifecycle.py             tests/test_agentic_memory_projection.py             tests/test_agentic_one_hop_bridge.py             tests/test_agentic_cache_append_experiment.py             tests/test_agentic_context_accounting.py             tests/test_agentic_retrospective_memory.py             tests/test_agentic_delayed_r2_retirement.py
