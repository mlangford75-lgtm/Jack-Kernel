name: NVIDIA live Jack qualification
on:
  push:
    branches: [experimental/adaptive-streamingirq-default, experimental/independent-audit-remediation]
    paths: ['.github/workflows/nvidia-live-qualification.yml', 'scripts/live_nvidia_qualification.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mode: [provider, security, coder-flash, coder-thorough, agentic-balanced]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.6'
      - name: Install pinned test environment
        run: python -m pip install -r requirements-test.txt
      - name: Live NVIDIA qualification
        timeout-minutes: 12
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python scripts/live_nvidia_qualification.py ${{ matrix.mode }}
