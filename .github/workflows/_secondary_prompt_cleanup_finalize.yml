name: One-shot secondary prompt cleanup finalizer

on:
  push:
    branches:
      - retire-secondary-prompt-launcher-surface

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: retire-secondary-prompt-launcher-surface
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'

      - name: Apply final cleanup and tests
        shell: pwsh
        run: python tools/_finalize_secondary_prompt_cleanup.py

      - name: Compile runtime and test
        shell: pwsh
        run: |
          python -m py_compile jack_kernel.py jack_responses_compat.py tests/test_secondary_prompt_launcher_retirement.py
          python -m pytest -q tests/test_secondary_prompt_launcher_retirement.py

      - name: Validate exact patch surface
        shell: pwsh
        run: |
          git diff --check
          git diff -- jack_kernel.py tests/test_secondary_prompt_launcher_retirement.py
          $unexpected = git status --porcelain | Where-Object {
            $_ -notmatch '^ M jack_kernel.py$' -and
            $_ -notmatch '^\?\? tests/test_secondary_prompt_launcher_retirement.py$'
          }
          if ($unexpected) {
            $unexpected | Write-Host
            Write-Error 'Unexpected files changed by finalizer.'
            exit 1
          }

      - name: Commit final source and regression cleanup
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jack_kernel.py tests/test_secondary_prompt_launcher_retirement.py
          git commit -m 'Complete secondary prompt launcher retirement'
          git push origin HEAD:retire-secondary-prompt-launcher-surface
