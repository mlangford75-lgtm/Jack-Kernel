name: One-shot Jack Kernel tagline update

on:
  push:
    branches:
      - docs/adopt-harness-for-the-harness-tagline

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/adopt-harness-for-the-harness-tagline
          fetch-depth: 0

      - name: Adopt public Jack Kernel tagline
        shell: pwsh
        run: |
          $path = 'README.md'
          $old = '# Jack Kernel'
          $new = '# Jack Kernel — The Harness for the Harness'
          $text = [System.IO.File]::ReadAllText($path)
          if (-not $text.StartsWith("$old`r`n") -and -not $text.StartsWith("$old`n")) {
            Write-Error 'README does not begin with the expected Jack Kernel heading.'
            exit 1
          }
          $text = [regex]::Replace($text, '^# Jack Kernel(?=\r?$)', [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $new }, [System.Text.RegularExpressions.RegexOptions]::Multiline)
          $count = ([regex]::Matches($text, [regex]::Escape($new))).Count
          if ($count -ne 1) {
            Write-Error "Expected exactly one new tagline heading, found $count."
            exit 1
          }
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          git diff --check
          git diff -- README.md
          $unexpected = git status --porcelain | Where-Object { $_ -notmatch '^ M README.md$' }
          if ($unexpected) {
            $unexpected | Write-Host
            Write-Error 'Unexpected files changed.'
            exit 1
          }

      - name: Commit tagline
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Adopt Harness for the Harness tagline'
          git push origin HEAD:docs/adopt-harness-for-the-harness-tagline
