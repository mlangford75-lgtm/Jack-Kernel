name: Experimental tool-free Coder Architect

on:
  pull_request:
    branches: [main]
    paths:
      - "jack_kernel.py"
      - "tests/test_coder_architect_no_tools.py"
      - "tests/test_coder_architect_readonly_role_isolation_20261124.py"
      - "tests/test_audit_cache_cost_evidence.py"
      - ".github/workflows/coder-architect-no-tools.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tool-free-architect:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.6"
      - name: Install pinned test environment
        shell: pwsh
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements-test.txt
      - name: Compile kernel and Architect boundary tests
        shell: pwsh
        run: python -m py_compile jack_kernel.py tests/test_coder_architect_no_tools.py tests/test_coder_architect_readonly_role_isolation_20261124.py
      - name: Verify tool-free delegation and historical context in both Coder modes
        shell: pwsh
        run: python -m pytest -q tests/test_coder_architect_no_tools.py tests/test_coder_architect_readonly_role_isolation_20261124.py

      - name: Measure P-2 wire prefix and P-3 host request diagnostics
        run: python -m pytest -q -s tests/test_audit_cache_cost_evidence.py
