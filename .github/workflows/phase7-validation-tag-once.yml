name: Phase 7 validation tag once

on:
  push:
    branches: [ops/phase7-validation-tag-once]
    paths:
      - .github/workflows/phase7-validation-tag-once.yml

permissions:
  contents: write

jobs:
  create-validated-tag:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: security-layer-phase7-validated-2026-10-05
      TARGET_SHA: 59aef730e11031b23f67c735e35f1e68c9ecc394
    steps:
      - name: Check out repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Create exact annotated Phase-7 validation tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git fetch --force --tags origin
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }

          git cat-file -e "$env:TARGET_SHA^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "validated target commit is unavailable" }

          $Remote = git ls-remote --tags origin "refs/tags/$($env:TAG_NAME)" "refs/tags/$($env:TAG_NAME)^{}"
          if ($LASTEXITCODE -ne 0) { throw "remote tag lookup failed" }

          if ($Remote) {
            $PeeledLine = $Remote | Where-Object { $_ -match '\^\{\}$' } | Select-Object -First 1
            if (-not $PeeledLine) { throw "existing remote Phase-7 tag is not an annotated tag" }
            $Peeled = ($PeeledLine -split '\s+')[0].Trim()
            if ($Peeled -ne $env:TARGET_SHA) {
              throw "existing remote Phase-7 tag points to $Peeled instead of $env:TARGET_SHA"
            }
            Write-Host "Validated remote tag already exists at exact target: $Peeled"
            exit 0
          }

          git config user.name "Jack Kernel Security Closure"
          if ($LASTEXITCODE -ne 0) { throw "git user.name configuration failed" }
          git config user.email "actions@users.noreply.github.com"
          if ($LASTEXITCODE -ne 0) { throw "git user.email configuration failed" }

          git tag -a $env:TAG_NAME $env:TARGET_SHA -m "Jack Kernel Security Layer Phase 7 validated closure. Target 59aef730e11031b23f67c735e35f1e68c9ecc394; implementation PR #35; closure PR #36; acceptance CI #182; closure-complete main CI #186."
          if ($LASTEXITCODE -ne 0) { throw "annotated tag creation failed" }

          git push origin "refs/tags/$($env:TAG_NAME)"
          if ($LASTEXITCODE -ne 0) { throw "annotated tag push failed" }

          $Remote = git ls-remote --tags origin "refs/tags/$($env:TAG_NAME)" "refs/tags/$($env:TAG_NAME)^{}"
          if ($LASTEXITCODE -ne 0) { throw "post-push remote tag lookup failed" }
          $TagLine = $Remote | Where-Object { $_ -notmatch '\^\{\}$' } | Select-Object -First 1
          $PeeledLine = $Remote | Where-Object { $_ -match '\^\{\}$' } | Select-Object -First 1
          if (-not $TagLine -or -not $PeeledLine) { throw "remote annotated tag proof is incomplete" }

          $TagObject = ($TagLine -split '\s+')[0].Trim()
          $Peeled = ($PeeledLine -split '\s+')[0].Trim()
          if ($Peeled -ne $env:TARGET_SHA) {
            throw "created Phase-7 tag peeled to $Peeled instead of $env:TARGET_SHA"
          }

          Write-Host "PHASE7_VALIDATED_TAG=$env:TAG_NAME"
          Write-Host "PHASE7_TAG_OBJECT=$TagObject"
          Write-Host "PHASE7_VALIDATED_TARGET=$Peeled"
