name: Native path portability qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-path-policy:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.6"
      - name: Install existing pinned test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Qualify native paths and the portable policy contract
        run: python -m pytest -q tests/test_native_path_portability.py tests/test_universal_executor_contract.py
