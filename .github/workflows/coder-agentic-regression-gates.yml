name: Coder and Agentic regression gates

on:
  pull_request:
    branches: [main]
    paths:
      - "jack_kernel.py"
      - "tests/**"
      - ".github/workflows/coder-agentic-regression-gates.yml"
  push:
    branches: [main]
    paths:
      - "jack_kernel.py"
      - "tests/**"
      - ".github/workflows/coder-agentic-regression-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coder-agentic-contracts:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.6"
      - name: Install existing test dependencies
        shell: pwsh
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements-test.txt
      - name: Compile kernel and focused regressions
        shell: pwsh
        run: |
          python -m py_compile jack_kernel.py tests/test_agentic_tool_cycle_guard.py tests/test_universal_tool_recovery.py tests/test_agentic_coder_planner_executor.py tests/test_coder_planner_delegation.py
      - name: Validate current Coder defaults and universal tool-cycle boundaries
        shell: pwsh
        run: |
          python -m pytest -q tests/test_agentic_tool_cycle_guard.py tests/test_universal_tool_recovery.py tests/test_agentic_coder_planner_executor.py tests/test_coder_planner_delegation.py
