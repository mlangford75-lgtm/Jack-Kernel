name: Phase 10 experimental static policy identity qualification

on:
  push:
    branches:
      - security/phase10-authority-policy-integrity-20261125
  pull_request:
    paths:
      - 'jack_policy_integrity.py'
      - 'tests/test_phase10_policy_identity.py'
      - 'docs/security/PHASE10_A_ACTIVE_POLICY_AUTHORITY_MAP_2026-11-25.md'
      - '.github/workflows/phase10-policy-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase10-windows-qualification:
    runs-on: windows-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python 3.14.6
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.6'
      - name: Install pinned test environment
        shell: pwsh
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements-test.txt
      - name: Compile Phase 10 measurement-only prototype
        run: python -m py_compile jack_policy_integrity.py tests/test_phase10_policy_identity.py
      - name: Run Phase 10 static-policy identity and tamper controls
        run: python -m pytest -q tests/test_phase10_policy_identity.py
      - name: Run previous Phase 7 credential and Phase 8 policy/security controls
        run: python -m pytest -q tests/test_phase7_credential_guard.py tests/test_phase8_source_baseline.py tests/test_phase8_runtime_enforcement.py
