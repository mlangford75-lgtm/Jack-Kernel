name: Runtime Code Integrity and executable identity qualification

on:
  pull_request:
    paths:
      - 'jack_runtime_code_guard.py'
      - 'jack_phase9b_enforcement.py'
      - 'jack_secure_entrypoint.py'
      - 'tests/test_phase9_runtime_code_guard.py'
      - 'tests/test_phase9_real_wrapper_qualification.py'
      - 'tests/test_phase9_enforced_release.py'
      - 'tests/test_phase9_live_kernel_optin.py'
      - 'tests/test_phase9_secure_child_http.py'
      - 'tests/test_phase9_live_security_http_tamper.py'
      - 'tests/benchmark_secured_stream.py'
      - '.github/workflows/phase9b-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase9b-windows-qualification:
    runs-on: windows-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python 3.14.6
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.6'
      - name: Install validated test dependencies
        shell: pwsh
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements-test.txt
      - name: Compile Runtime Code Integrity guard
        run: python -m py_compile jack_runtime_code_guard.py tests/test_phase9_runtime_code_guard.py tests/test_phase9_real_wrapper_qualification.py jack_phase9b_enforcement.py jack_secure_entrypoint.py tests/test_phase9_enforced_release.py tests/test_phase9_live_kernel_optin.py tests/test_phase9_secure_child_http.py tests/test_phase9_live_security_http_tamper.py
      - name: Run isolated executable identity and Source Drift Protection wrapper qualification
        run: python -m pytest -q tests/test_phase9_runtime_code_guard.py tests/test_phase9_real_wrapper_qualification.py tests/test_phase9_enforced_release.py
      - name: Run loaded Jack Kernel with mandatory Runtime Code Integrity in isolated child
        run: python -m pytest -q tests/test_phase9_live_kernel_optin.py
      - name: Run secure child Runtime Code Integrity loopback HTTP smoke
        run: python -m pytest -q tests/test_phase9_secure_child_http.py
      - name: Live secured HTTP security tamper attack (model + shared authentication)
        run: python -m pytest -q tests/test_phase9_live_security_http_tamper.py
      - name: Run Source Drift Protection and preservation gates
        run: python -m pytest -q tests/test_phase8_source_baseline.py tests/test_phase8_runtime_enforcement.py tests/test_phase8_ledger_observation.py tests/test_phase8_adversarial_preservation.py

      - name: Measure secured SSE release path and concurrent integrity overhead
        timeout-minutes: 35
        env:
          JACK_BENCHMARK_AUDIT2: '1'
        run: python tests/benchmark_secured_stream.py

      - name: Controlled P-1 comparison of the two qualified immutable fingerprint versions
        timeout-minutes: 35
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $first = '753ce5c9e783b9691922870b9640fde5031e10f2'
          $second = 'd1808d86fee2e02e9e30e17f8e25dd612140dcd7'
          $root = Join-Path $env:RUNNER_TEMP 'jack-p1-controlled'
          New-Item -ItemType Directory -Path $root | Out-Null
          foreach ($ref in @($first, $second)) {
            git fetch --no-tags --depth=1 origin $ref
            if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch exact benchmark revision' }
            git worktree add --detach (Join-Path $root $ref) $ref
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create isolated benchmark checkout' }
          }
          $records = @()
          try {
            foreach ($ref in @($first, $second, $second, $first)) {
              Push-Location (Join-Path $root $ref)
              try {
                Write-Host "Controlled P-1 revision: $ref"
                $output = python tests/benchmark_secured_stream.py
                if ($LASTEXITCODE -ne 0) { throw 'Benchmark qualification failed' }
                $output | Write-Host
                $json = @($output | Where-Object { $_ -like 'P1_BENCHMARK_JSON *' } | ForEach-Object {
                  $_.Substring('P1_BENCHMARK_JSON '.Length) | ConvertFrom-Json
                })
                $secured = @($json | Where-Object { $_.mode -eq 'secured' })
                if ($secured.Count -ne 1) { throw 'Missing secured measurement' }
                $records += [PSCustomObject]@{ revision = $ref; secured = $secured[0] }
              } finally {
                Pop-Location
              }
            }
            $a = @($records | Where-Object { $_.revision -eq $first } | ForEach-Object { $_.secured.seconds } | Sort-Object)
            $b = @($records | Where-Object { $_.revision -eq $second } | ForEach-Object { $_.secured.seconds } | Sort-Object)
            if ($a.Count -ne 6 -or $b.Count -ne 6) { throw 'Incomplete paired measurement' }
            $am = ($a[2] + $a[3]) / 2
            $bm = ($b[2] + $b[3]) / 2
            $sizes = @($records | ForEach-Object { $_.secured.released_bytes } | Sort-Object -Unique)
            if ($sizes.Count -ne 1) { throw 'Released byte count changed' }
            $summary = [PSCustomObject]@{
              first_revision = $first
              second_revision = $second
              order = 'ABBA'
              first_seconds = $a
              second_seconds = $b
              first_median_seconds = $am
              second_median_seconds = $bm
              second_relative_change_pct = 100 * ($bm / $am - 1)
              released_bytes = $sizes[0]
            }
            Write-Host ('P1_CONTROLLED_JSON ' + ($summary | ConvertTo-Json -Compress))
          } finally {
            foreach ($ref in @($first, $second)) {
              git worktree remove (Join-Path $root $ref)
            }
          }
